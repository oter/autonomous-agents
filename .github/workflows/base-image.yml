name: base-image

on:
  push:
    branches: [main]
    paths: [image/**, .github/workflows/base-image.yml]
  workflow_dispatch:

jobs:
  build-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - id: tag
        run: echo "tag=$(date -u +%F)" >> "$GITHUB_OUTPUT"
      # arm64 because the Runners are Apple Silicon; amd64 for Coolify.
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: image
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/oter/agent-base:${{ steps.tag.outputs.tag }}
