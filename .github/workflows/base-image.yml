name: base-image

# Pushed on date-shaped git tags (the SPEC's image tag format), e.g.
#   git tag 2026-09-01 && git push origin 2026-09-01
on:
  push:
    tags: ['20[0-9][0-9]-[0-9][0-9]-[0-9][0-9]']
  workflow_dispatch:

jobs:
  build-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      # Image tag = git tag; workflow_dispatch falls back to today's date.
      - id: tag
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then t="$GITHUB_REF_NAME"; else t=$(date -u +%F); fi
          echo "tag=$t" >> "$GITHUB_OUTPUT"
      # arm64 because the Runners are Apple Silicon; amd64 for Coolify.
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: image
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/oter/agent-base:${{ steps.tag.outputs.tag }}
