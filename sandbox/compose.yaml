# Local sandbox: RustFS as the Journal bucket (S3-compatible, Apache-2.0;
# MinIO's community repository was archived in April 2026), and the control
# plane as a container with the Docker socket, the way Coolify runs it. Runs
# are containers on your own daemon and reach both over host.docker.internal.
name: autonomous-agents
services:
  storage:
    image: rustfs/rustfs
    environment:
      RUSTFS_ACCESS_KEY: sandbox
      RUSTFS_SECRET_KEY: sandbox123
      RUSTFS_CONSOLE_ENABLE: "true"
    ports: ["9000:9000", "9001:9001"]
    volumes: ["storage:/data"]

  # One-shot: the bucket the config names, made with the agent image's curl
  # (it is on the daemon anyway). Create it, or confirm it is already there
  # from an earlier up. ListObjects is the index (SPEC §10), so this is all
  # the setup a bucket ever needs.
  bucket:
    image: autonomous-agents/agent:dev
    depends_on: [storage]
    entrypoint: ["sh", "-c", "until curl -sS -o /dev/null http://storage:9000/; do sleep 1; done;
      s3() { curl -fsS --aws-sigv4 aws:amz:auto:s3 -u sandbox:sandbox123 \"$@\"; };
      s3 -X PUT http://storage:9000/agentruns || s3 -I http://storage:9000/agentruns"]

  control-plane:
    build: ..
    depends_on:
      bucket: { condition: service_completed_successfully }
    ports: ["8081:8081", "8082:8082"]
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./control-plane.yaml:/etc/autonomous-agents/control-plane.yaml:ro
      - ./agents:/etc/autonomous-agents/agents:ro
      # The master identity (SPEC §3), gitignored: age-keygen -o sandbox/age-master.key
      # A missing file is an error here, not a directory made in its place.
      - type: bind
        source: ./age-master.key
        target: /etc/autonomous-agents/age-master.key
        read_only: true
        bind: { create_host_path: false }
    environment:
      AWS_ACCESS_KEY_ID: sandbox
      AWS_SECRET_ACCESS_KEY: sandbox123
      # No model credential here: it is an Allowlist value in the Agent's
      # YAML, encrypted to the key above (README, "Secrets").
    # Docker Desktop and OrbStack provide the name; a plain Linux daemon needs this.
    extra_hosts: ["host.docker.internal:host-gateway"]

volumes:
  storage:
